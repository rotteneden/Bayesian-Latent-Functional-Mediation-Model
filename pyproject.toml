[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "blafm"
version = "0.1.0"
description = "Bayesian latent functional mediation for donor-grouped single-cell data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.13,<2", "tqdm>=4.66,<5"]

[project.optional-dependencies]
paper = ["matplotlib>=3.8,<4", "pandas>=2.1,<3", "ijson>=3.2,<4"]

[tool.setuptools]
packages = ["blafm"]
